<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal homepage style reference</title>
    <style>
      :root { color: #333; background: #fff; font-family: Arial, Helvetica, sans-serif; }
      body { margin: 0; }
      main { align-items: center; display: flex; min-height: 100vh; justify-content: center; padding: 3rem 1.5rem; text-align: center; }
      .profile { width: min(100%, 34rem); }
      .avatar { background: #ececec; border-radius: 50%; display: grid; height: 7.5rem; margin: 0 auto 1.75rem; place-items: center; width: 7.5rem; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.25rem, 7vw, 4.5rem); font-weight: 400; margin: 0; }
      .slogan { color: #777; font-size: 1rem; margin: 1rem 0 2rem; }
      hr { border: 0; border-top: 1px solid #ddd; margin: 0 auto 1.5rem; width: 4rem; }
      nav ul { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; list-style: none; margin: 0; padding: 0; }
      nav li:not(:last-child)::after { color: #bbb; content: "|"; margin-left: 0.6rem; }
      a { color: #555; text-decoration: none; }
      a:hover, a:focus-visible { color: #111; text-decoration: underline; text-underline-offset: 0.25em; }
    </style>
  </head>
  <body>
    <main>
      <section class="profile" aria-labelledby="profile-name">
        <div class="avatar" aria-hidden="true">Photo</div>
        <h1 id="profile-name">Your Name</h1>
        <p class="slogan">A short and meaningful personal statement.</p>
        <hr />
        <nav aria-label="Primary navigation">
          <ul>
            <li><a href="/about/">About</a></li>
            <li><a href="/blog/">Blog</a></li>
            <li><a href="https://github.com/">GitHub</a></li>
          </ul>
        </nav>
      </section>
    </main>
  </body>
</html>
